<div class="accordion " id="crearProductoAccordion">

  <div class="accordion-item border-0 bg-transparent">

    <h2 class="accordion-header">
      <button
        class="accordion-button bg-secondary-subtle fw-semibold border border-secondary"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#crearProductoCollapse"
        aria-expanded="true"
        aria-controls="crearProductoCollapse">

        <span>Añadir producto</span>

      </button>
    </h2>

    <div
      id="crearProductoCollapse"
      class="accordion-collapse collapse rounded-bottom-3"
      data-bs-parent="#crearProductoAccordion">

      <div class="accordion-body bg-secondary-subtle p-0  rounded-bottom-3">

        <div class="bg-secondary-subtle bg-opacity-10 border border-secondary rounded-bottom-3 p-3">

          <div class="card-body p-3 rounded-bottom-3">

            <form [formGroup]="formulario" (ngSubmit)="enviar()">

              <div class="row g-3">

                <div class="col-md-6">
                  <label class="form-label small text-muted fw-semibold">Nombre</label>
                  <input
                    class="form-control"
                    formControlName="name"
                    placeholder="Nombre del producto">
                </div>

                <div class="col-md-6">
                  <label class="form-label small text-muted fw-semibold">Categoría</label>
                  <input
                    class="form-control"
                    formControlName="category"
                    placeholder="Ej: Hombre">
                </div>

                <div class="col-12">
                  <label class="form-label small text-muted fw-semibold">Descripción</label>
                  <textarea
                    class="form-control"
                    rows="3"
                    formControlName="description"
                    placeholder="Descripción breve del producto">
                  </textarea>
                </div>

                <div class="col-md-6">
                  <label class="form-label small text-muted fw-semibold">Precio (€)</label>
                  <input
                    type="number"
                    class="form-control"
                    formControlName="price">
                </div>

                <div class="col-md-6">
                  <label class="form-label small text-muted fw-semibold">URL imagen</label>
                  <input
                    class="form-control"
                    formControlName="image"
                    placeholder="https://">
                </div>

                <div class="col-12 d-flex justify-content-between align-items-center mt-2">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      formControlName="active"
                      id="activoCheck">
                    <label
                      class="form-check-label fw-semibold"
                      for="activoCheck">
                      Producto activo
                    </label>
                  </div>

                  <button type="submit" class="btn btn-success px-4">
                    Crear producto
                  </button>
                </div>

              </div>

            </form>

          </div>
        </div>

      </div>
    </div>

  </div>
</div>
